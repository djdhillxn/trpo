train:
  seed: 0
  epochs: 300
  steps_per_epoch: 100000
  max_ep_len: 10000
  save_interval: 25
  run_name: qbert_single_path
  normalize_obs: false
  memory_mode: safe
  progress_mode: 'off'
  obs_storage: ram
  num_workers: 4
env:
  type: atari
  id: ALE/Qbert-v5
method:
  name: trpo
  variant: default
algo:
  gamma: 0.99
  lam: 1.0
  estimator: trpo_paper
  normalize_weights: false
  bootstrap_truncated_paths: false
  max_kl: 0.01
  cg_iters: 10
  cg_damping: 0.1
  cg_residual_tol: 1.0e-10
  backtrack_coeff: 0.8
  backtrack_iters: 10
  fvp_kl_metric: average
  npg_stepsize: 0.05
  full_batch_chunk_size: 8192
  fvp_subsample_fraction: null
  fvp_estimator: analytic
  empirical_fim_batch_size: 128
  vf_lr: 0.0003
  vf_weight_decay: 0.0
  vf_iters: 40
  vf_batch_size: 2048
  ppo_clip_ratio: 0.2
  ppo_update_epochs: 10
  ppo_minibatch_size: 256
  ppo_eval_batch_size: 1024
  ppo_target_kl: 0.01
  ppo_pi_lr: 0.0003
  ppo_vf_lr: 0.001
  ppo_vf_epochs: 10
  ppo_entropy_coef: 0.0
  ppo_kl_coef: 1.0
  ppo_adaptive_kl: true
  ppo_max_grad_norm: 0.5
  ppo_anneal_lr: false
  ppo_anneal_clip_ratio: false
model:
  activation: relu
  policy_hidden_sizes: []
  value_hidden_sizes: []
  init_log_std: -0.5
  cnn_fc_dim: 20
