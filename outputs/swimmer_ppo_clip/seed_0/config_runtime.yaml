train:
  seed: 0
  epochs: 200
  steps_per_epoch: 100000
  max_ep_len: 1000
  save_interval: 25
  run_name: swimmer_ppo_clip
  normalize_obs: false
  memory_mode: standard
  progress_mode: 'off'
  obs_storage: ram
  num_workers: 12
env:
  type: mujoco
  id: Swimmer-v5
method:
  name: ppo
  variant: clip
algo:
  gamma: 0.99
  lam: 0.95
  estimator: gae
  normalize_weights: true
  bootstrap_truncated_paths: true
  max_kl: 0.01
  cg_iters: 10
  cg_damping: 0.1
  cg_residual_tol: 1.0e-10
  backtrack_coeff: 0.8
  backtrack_iters: 10
  fvp_kl_metric: average
  npg_stepsize: 0.05
  full_batch_chunk_size: null
  fvp_subsample_fraction: null
  fvp_estimator: analytic
  empirical_fim_batch_size: 128
  vf_lr: 0.001
  vf_weight_decay: 0.0
  vf_iters: 40
  vf_batch_size: 512
  ppo_clip_ratio: 0.2
  ppo_update_epochs: 10
  ppo_minibatch_size: 2048
  ppo_eval_batch_size: 4096
  ppo_target_kl: 0.01
  ppo_pi_lr: 0.0003
  ppo_vf_lr: 0.001
  ppo_vf_epochs: 10
  ppo_entropy_coef: 0.0
  ppo_kl_coef: 1.0
  ppo_adaptive_kl: true
  ppo_max_grad_norm: 0.5
  ppo_anneal_lr: false
  ppo_anneal_clip_ratio: false
model:
  activation: tanh
  policy_hidden_sizes:
  - 30
  value_hidden_sizes:
  - 30
  init_log_std: -0.5
  cnn_fc_dim: 20
