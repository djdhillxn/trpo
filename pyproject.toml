[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trpo-repro"
version = "0.1.0"
description = "trpo reproducibility challenge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "gymnasium>=0.29",
]

[tool.setuptools.packages.find]
include = ["trpo_repro*"]