train:
  seed: 0
  epochs: 200
  steps_per_epoch: 5000
  max_ep_len: 1000
  save_interval: 10
  run_name: trpo_run
  normalize_obs: false

env:
  type: mujoco
  id: CartPole-v1

algo:
  gamma: 0.99
  lam: 1.0
  estimator: paper_mc
  normalize_weights: false
  bootstrap_truncated_paths: false
  max_kl: 0.01
  cg_iters: 10
  cg_damping: 0.1
  cg_residual_tol: 1.0e-10
  backtrack_coeff: 0.8
  backtrack_iters: 10
  vf_lr: 0.001
  vf_weight_decay: 0.0
  vf_iters: 40
  vf_batch_size: 512

model:
  activation: tanh
  policy_hidden_sizes: [64, 64]
  value_hidden_sizes: [64, 64]
  init_log_std: -0.5
  cnn_fc_dim: 20
