model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  gradient_checkpointing: false
  # A100 40GB profile: full BF16 models are faster than 4-bit here.
  policy_device_map: null
  policy_load_in_4bit: false
  policy_load_in_8bit: false
  ref_device_map: null
  ref_torch_dtype: bfloat16
  ref_load_in_4bit: false
  ref_load_in_8bit: false

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

reward_model:
  checkpoint_dir: outputs/rlhf/qwen25_05b_helpsteer3_reward/checkpoint_final
  torch_dtype: bfloat16
  device_map: null
  load_in_4bit: false
  load_in_8bit: false

data:
  prompt_split: train
  max_prompt_samples: 24000

generation:
  max_prompt_length: 768
  max_new_tokens: 96
  temperature: 0.7
  top_p: 0.9
  do_sample: true
  repetition_penalty: 1.05
  no_repeat_ngram_size: 4

# Conservative RLHF settings. The previous run let this coefficient decay to
# ~1e-6, after which the policy drifted into non-language reward hacking.
kl:
  init_kl_coef: 0.10
  min_kl_coef: 0.05
  max_kl_coef: 1.0
  target_ref_kl: 0.02
  horizon: 10000
  adaptive: true

reward_shaping:
  reward_clip_min: -5.0
  reward_clip_max: 5.0
  length_penalty_coef: 0.005
  missing_eos_penalty: 0.25

ppo:
  learning_rate: 2.0e-6
  weight_decay: 0.0
  ppo_epochs: 1
  minibatch_size: 8
  clip_range: 0.1
  value_clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.0
  max_grad_norm: 1.0
  target_policy_kl: 0.01
  gamma: 1.0
  lam: 0.95

train:
  output_dir: outputs/rlhf/qwen25_05b_helpsteer3_ppo
  seed: 839
  device: cuda
  rollout_batch_size: 24
  total_updates: 100
  save_every: 50
  sample_every: 25
  artifact_every: 25
