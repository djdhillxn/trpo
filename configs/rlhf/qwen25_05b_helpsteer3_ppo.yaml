model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  gradient_checkpointing: true
  # Policy is trainable through LoRA. 4-bit is the Colab-friendly default.
  policy_device_map: null
  policy_load_in_4bit: true
  policy_load_in_8bit: false
  # Reference is frozen; loading it in 4-bit saves memory.
  ref_device_map: null
  ref_torch_dtype: bfloat16
  ref_load_in_4bit: true
  ref_load_in_8bit: false

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

reward_model:
  checkpoint_dir: outputs/rlhf/qwen25_05b_helpsteer3_reward/checkpoint_final
  torch_dtype: bfloat16
  device_map: null
  load_in_4bit: true
  load_in_8bit: false

data:
  prompt_split: train
  max_prompt_samples: 12000

generation:
  max_prompt_length: 512
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  do_sample: true

kl:
  init_kl_coef: 0.05
  target_ref_kl: 0.05
  horizon: 10000

ppo:
  learning_rate: 1.0e-5
  weight_decay: 0.0
  ppo_epochs: 4
  minibatch_size: 2
  clip_range: 0.2
  value_clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.0
  max_grad_norm: 1.0
  target_policy_kl: 0.05
  gamma: 1.0
  lam: 0.95

train:
  output_dir: outputs/rlhf/qwen25_05b_helpsteer3_ppo
  seed: 839
  device: cuda
  rollout_batch_size: 4
  total_updates: 300
  save_every: 50
  sample_every: 25
