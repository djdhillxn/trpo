model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  policy_device_map: null
  policy_load_in_4bit: true
  policy_load_in_8bit: false
  ref_device_map: null
  ref_torch_dtype: bfloat16
  ref_load_in_4bit: true
  ref_load_in_8bit: false

reward_model:
  checkpoint_dir: outputs/rlhf/qwen25_05b_helpsteer3_reward/checkpoint_final
  torch_dtype: bfloat16
  device_map: null
  load_in_4bit: true
  load_in_8bit: false

data:
  eval_split: validation

generation:
  max_prompt_length: 512
  max_new_tokens: 160
  temperature: 0.7
  top_p: 0.9
  do_sample: true

eval:
  output_dir: outputs/rlhf/qwen25_05b_helpsteer3_eval
  device: cuda
  policy_checkpoint_dir: outputs/rlhf/qwen25_05b_helpsteer3_ppo/checkpoint_final
  num_prompts: 100
  batch_size: 2
  num_demo_rows: 12
