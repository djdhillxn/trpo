model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  policy_device_map: null
  policy_load_in_4bit: false
  policy_load_in_8bit: false

reward_model:
  checkpoint_dir: outputs/rlhf/qwen25_05b_helpsteer3_reward_4096/checkpoint_best
  torch_dtype: bfloat16
  device_map: null
  load_in_4bit: false
  load_in_8bit: false

data:
  eval_split: validation

# This controls qualitative evaluation only, not training.
# For the 512-token PPO checkpoint, keep 512 here if you want apples-to-apples long-form outputs.
generation:
  max_prompt_length: 3072
  max_new_tokens: 512
  min_new_tokens: 0
  temperature: 0.7
  top_p: 0.9
  do_sample: false
  repetition_penalty: 1.03
  no_repeat_ngram_size: 3

# One list, one evaluator, all pairwise comparisons derived from the same generations.
# For interrupted PPO runs, point directly to whichever checkpoint exists.
policies:
  - label: base
    checkpoint_dir: null
  - label: sft_4096
    checkpoint_dir: outputs/rlhf/qwen25_05b_helpsteer3_sft_4096/checkpoint_final
  - label: ppo_4096_u250
    # Newer training code saves outputs/.../checkpoints/update_00250.
    # If your run used the older layout, change this to outputs/.../checkpoint_00250.
    checkpoint_dir: outputs/rlhf/qwen25_05b_helpsteer3_ppo_4096/checkpoints/update_00250

eval:
  output_dir: outputs/rlhf/qwen25_05b_helpsteer3_eval_suite_4096_u250
  device: cuda
  seed: 839
  shuffle: true
  # Use 200 first. Change to all for the full 2017-example validation pass.
  num_prompts: 200
  batch_size: 1
  num_demo_rows: 16
  tie_epsilon: 0.0
  # resident = load all policies once; fastest but more VRAM.
  # sequential = one policy at a time; slower but safer if long 512-token eval OOMs.
  load_mode: resident
