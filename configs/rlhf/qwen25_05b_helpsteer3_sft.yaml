model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  device_map: null
  load_in_4bit: false
  load_in_8bit: false
  gradient_checkpointing: false

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_split: train
  max_length: 1024
  max_train_samples: null

train:
  output_dir: outputs/rlhf/qwen25_05b_helpsteer3_sft
  seed: 839
  device: cuda
  # This is a warm-start, not the main alignment step. After the prompt
  # sanitization fix, use two clean passes to put the policy closer to the
  # HelpSteer3 chosen-response distribution before PPO starts.
  epochs: 2
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 8.0e-6
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_steps: 50
  log_every: 10
  artifact_every: 50
  save_every_steps: 0
  num_workers: 2
  pin_memory: true
  persistent_workers: true
