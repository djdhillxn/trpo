model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  device_map: null
  # A100 40GB profile: full BF16 is faster than 4-bit for this 0.5B model.
  load_in_4bit: false
  load_in_8bit: false
  gradient_checkpointing: false

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_split: train
  eval_split: validation
  max_length: 1024
  # Full HelpSteer3 preference split after dropping ties/malformed examples.
  max_train_samples: null
  max_eval_samples: null

train:
  output_dir: outputs/rlhf/qwen25_05b_helpsteer3_reward
  seed: 839
  device: cuda
  epochs: 2
  # A100 40GB target: increase to 12 if GPU memory stays below ~30 GB.
  batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  log_every: 10
  eval_every: 100
  eval_max_batches: 80
  final_eval_max_batches: null
  artifact_every: 50
  save_every_steps: 0
  num_workers: 2
  pin_memory: true
  persistent_workers: true
