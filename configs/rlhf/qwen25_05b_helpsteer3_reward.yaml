model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  torch_dtype: bfloat16
  trust_remote_code: false
  # Set device_map: auto for multi-GPU/offload. Keep null for normal single Colab GPU.
  device_map: null
  load_in_4bit: true
  load_in_8bit: false
  gradient_checkpointing: true

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  train_split: train
  eval_split: validation
  max_length: 1024
  # Start small for first Colab run; set to null for full HelpSteer3.
  max_train_samples: 16000
  max_eval_samples: 2000

train:
  output_dir: outputs/rlhf/qwen25_05b_helpsteer3_reward
  seed: 839
  device: cuda
  epochs: 2
  batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  log_every: 10
  eval_every: 100
  eval_max_batches: 50
  final_eval_max_batches: null
  num_workers: 0
